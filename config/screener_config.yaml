presets:

  quality_compounder:
    display_name: "Quality Compounder"
    filters:
      roe_min: 15
      debt_to_equity_max: 1.0
      free_cash_flow_min: 0
      revenue_cagr_5yr_min: 10

  value_pick:
    display_name: "Value Pick"
    filters:
      pe_max: 20
      pb_max: 3.0
      debt_to_equity_max: 2.0
      dividend_yield_min: 1

  growth_accelerator:
    display_name: "Growth Accelerator"
    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      debt_to_equity_max: 2.0

  dividend_champion:
    display_name: "Dividend Champion"
    filters:
      dividend_yield_min: 2
      dividend_payout_max: 80
      free_cash_flow_min: 0

  debt_free_blue_chip:
    display_name: "Debt-Free Blue Chip"
    filters:
      debt_to_equity_equals: 0
      roe_min: 12
      sales_min: 5000

  turnaround_watch:
    display_name: "Turnaround Watch"
    filters:
      revenue_cagr_3yr_min: 10
      free_cash_flow_min: 0
      debt_to_equity_declining: true